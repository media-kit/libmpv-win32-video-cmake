name: mpv clang
defaults:
  run:
    shell: bash

on:
  workflow_call:
    secrets:
      CACHE_VERSION:
        required: true
    inputs:
      github_release:
        description: 'Upload to Github release'
        required: false
        default: false
        type: boolean
      command:
        description: 'Run custom command before building'
        required: false
        type: string
      mpv_tarball:
        description: 'Build latest mpv tarball'
        required: false
        default: false
        type: boolean
      source_sha:
        description: 'Exact commit to build; supplied by llvm_clang.yml'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      github_release:
        description: 'Upload to Github release'
        required: false
        default: false
        type: boolean
      command:
        description: 'Run custom command before building'
        required: false
        type: string
      mpv_tarball:
        description: 'Build latest mpv tarball'
        required: false
        default: false
        type: boolean
      source_sha:
        description: 'Exact commit to build; supplied by llvm_clang.yml'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build_mpv:
    name: Building mpv
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bit: [x86_64, x86_64_v3, aarch64]
    env:
      BIT: ${{ matrix.bit }}
    container:
      image: docker://ghcr.io/shinchiro/archlinux:latest
    outputs:
      mpv_ver: ${{ steps.build_mpv_step.outputs.mpv_ver }}
    steps:
      - name: Init variable
        run: |
          if [[ $BIT == "x86_64" ]]; then
            echo "arch=x86_64" >> $GITHUB_ENV
          elif [[ $BIT == "x86_64_v3" ]]; then
            echo "arch=x86_64" >> $GITHUB_ENV
            echo "x86_64_level=-v3" >> $GITHUB_ENV
            echo "x86_64_v3_ARCH=-DGCC_ARCH=x86-64-v3" >> $GITHUB_ENV
          elif [[ $BIT == "aarch64" ]]; then
            echo "arch=aarch64" >> $GITHUB_ENV
          fi

      - name: Setup git config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true
          git config --global rebase.autoStash true
          git config --global fetch.prune true
          git config --global --add safe.directory $PWD

      - uses: actions/checkout@main
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Loading clang sysroot cache
        uses: actions/cache/restore@main
        with:
          path: |
            clang_root
          key: ${{ secrets.CACHE_VERSION }}-clang_root-${{ github.run_id }}
          restore-keys: |
            ${{ secrets.CACHE_VERSION }}-clang_root

      - name: Loading repository cache
        uses: actions/cache/restore@main
        with:
          path: src_packages
          key: ${{ secrets.CACHE_VERSION }}-repository-${{ github.run_id }}
          restore-keys: |
            ${{ secrets.CACHE_VERSION }}-repository

      - name: Loading ${{ matrix.bit }} toolchain cache
        uses: actions/cache/restore@main
        with:
          path: |
            build_${{ matrix.bit }}
          key: ${{ secrets.CACHE_VERSION }}-clang-${{ matrix.bit }}_toolchain-${{ github.run_id }}
          restore-keys: |
            ${{ secrets.CACHE_VERSION }}-clang-${{ matrix.bit }}_toolchain

      - name: Running custom command
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.command != '' }}
        continue-on-error: true
        run: ${{ inputs.command }}

      - name: Configuring CMake & Downloading source
        run: |
          cmake -DTARGET_ARCH=${{ env.arch }}-w64-mingw32 -DCOMPILER_TOOLCHAIN=clang ${{ env.x86_64_v3_ARCH }} -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_$BIT/$BIT-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -DENABLE_CCACHE=ON -DCLANG_PACKAGES_LTO=ON -G Ninja --fresh -B build_$BIT -S $PWD
          ninja -C build_$BIT download || true

      - name: Building mpv
        id: build_mpv_step
        env:
          MPV_TARBALL: ${{ inputs.mpv_tarball || false }}
        run: |
          ninja -C build_$BIT update
          $MPV_TARBALL && ninja -C build_$BIT mpv-release || ninja -C build_$BIT mpv
          $MPV_TARBALL && echo "mpv_ver=$(cat build_$BIT/packages/mpv-release-prefix/VERSION)" >> $GITHUB_OUTPUT || echo "mpv_ver=UNKNOWN" >> $GITHUB_OUTPUT

      - name: Packaging mpv
        run: |
          mkdir -p release_$BIT
          ninja -C build_$BIT mpv-packaging; mv build_$BIT/mpv*.7z release_$BIT

      - name: Collecting logs
        if: always()
        run: |
          mkdir -p build_${BIT}_logs
          cp -fr $(find build_$BIT -type f -iname "*-*.log" -or -wholename "*/ffbuild/config.log") build_${BIT}_logs || true
          7z a -m0=lzma2 -mx=9 -ms=on logs.7z build*logs

      - name: Uploading logs
        uses: actions/upload-artifact@master
        if: always()
        with:
          name: mpv-${{ matrix.bit }}-logs
          path: logs.7z
          retention-days: 1

      - name: Uploading ${{ matrix.bit }} build
        uses: actions/upload-artifact@master
        with:
          name: mpv-${{ matrix.bit }}
          path: |
            release_${{ matrix.bit }}/mpv-${{ env.arch }}*.7z
            release_${{ matrix.bit }}/mpv-dev-${{ env.arch }}*.7z

      - name: Uploading ${{ matrix.bit }} debug
        uses: actions/upload-artifact@master
        with:
          name: mpv-${{ matrix.bit }}-debug
          path: release_${{ matrix.bit }}/mpv-debug-${{ env.arch }}*

      - name: Cleaning build directory
        if: always()
        run: |
          rm -rf build_$BIT/mpv*
          rm -rf release_$BIT/mpv-debug*.7z

      - name: Cleaning rust toolchain directory
        if: always()
        run: |
          ninja -C build_$BIT cargo-clean

      - name: Saving clang sysroot cache
        uses: actions/cache/save@main
        if: ${{ always() && matrix.bit == 'x86_64' }}
        with:
          path: |
            clang_root
          key: ${{ secrets.CACHE_VERSION }}-clang_root-${{ github.run_id }}

      - name: Saving repository cache
        uses: actions/cache/save@main
        if: ${{ always() && matrix.bit == 'x86_64' }}
        with:
          path: src_packages
          key: ${{ secrets.CACHE_VERSION }}-repository-${{ github.run_id }}

      - name: Saving ${{ matrix.bit }} toolchain cache
        uses: actions/cache/save@main
        if: always()
        with:
          path: |
            build_${{ matrix.bit }}
          key: ${{ secrets.CACHE_VERSION }}-clang-${{ matrix.bit }}_toolchain-${{ github.run_id }}

      - name: Saving release_${{ matrix.bit }} cache
        uses: actions/cache/save@main
        with:
          path: release_${{ matrix.bit }}
          key: ${{ secrets.CACHE_VERSION }}-release_${{ matrix.bit }}-${{ github.run_id }}

  release:
    name: Upload release
    needs: build_mpv
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.github_release && !inputs.mpv_tarball }}
    permissions:
      actions: read
      contents: write
    concurrency:
      group: publish-libmpv
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          BUILD_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const {execFileSync} = require('node:child_process');
            const assert = require('node:assert/strict');
            const {owner, repo} = context.repo;
            const input = process.env.BUILD_RUN_ID;
            assert.match(input, /^[1-9][0-9]*$/);
            const run_id = Number(input);
            assert(Number.isSafeInteger(run_id));
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id});
            assert.equal(run_id, context.runId);
            assert(['.github/workflows/llvm_clang.yml', '.github/workflows/mpv_clang.yml'].includes(run.path));
            assert.equal(run.head_sha, context.sha);
            assert.equal(process.env.SOURCE_SHA, run.head_sha);
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {owner, repo, run_id, filter: 'latest', per_page: 100});
            for (const bit of ['x86_64', 'x86_64_v3', 'aarch64']) {
              const found = jobs.filter(job => job.name.endsWith(`Building mpv (${bit})`));
              assert.equal(found.length, 1, `Missing or duplicate build job: ${bit}`);
              assert.equal(found[0].status, 'completed');
              assert.equal(found[0].conclusion, 'success');
            }
            for (const [file, tag] of [['mpv', 'v0.41.0'], ['ffmpeg', 'n9.0.2']]) {
              const {data: recipe} = await github.rest.repos.getContent({owner, repo, path: `packages/${file}.cmake`, ref: run.head_sha});
              assert.equal(recipe.type, 'file');
              const source = Buffer.from(recipe.content, 'base64').toString('utf8');
              assert(source.split(/\r?\n/).some(line => line.trim() === `GIT_TAG ${tag}`), `Unexpected ${file} version`);
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {owner, repo, run_id, per_page: 100});
            const directory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'libmpv-release-'));
            const assets = [];
            const dates = new Set();
            const sums = [];
            for (const [bit, arch, machine] of [['x86_64', 'x86_64', 0x8664], ['x86_64_v3', 'x86_64-v3', 0x8664], ['aarch64', 'aarch64', 0xaa64]]) {
              const name = `mpv-${bit}`;
              const found = artifacts.filter(a => a.name === name);
              assert.equal(found.length, 1, `Missing or duplicate artifact: ${name}`);
              const artifact = found[0];
              assert(!artifact.expired, `Artifact expired: ${name}`);
              assert.equal(artifact.workflow_run.head_sha, run.head_sha);
              const job = jobs.find(job => job.name.endsWith(`Building mpv (${bit})`));
              assert(Date.parse(artifact.created_at) >= Date.parse(job.started_at) && Date.parse(artifact.created_at) <= Date.parse(job.completed_at), 'Artifact does not belong to the successful build job');
              const url = `${process.env.GITHUB_API_URL}/repos/${owner}/${repo}/actions/artifacts/${artifact.id}/zip`;
              let response = await fetch(url, {headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'}, redirect: 'manual'});
              if (response.status === 302) {
                response = await fetch(response.headers.get('location'));
              }
              assert(response.ok, `Download failed: ${name} (${response.status})`);
              const zip = path.join(directory, `${name}.zip`);
              const bytes = Buffer.from(await response.arrayBuffer());
              assert.equal(artifact.digest, 'sha256:' + crypto.createHash('sha256').update(bytes).digest('hex'), `Artifact checksum mismatch: ${name}`);
              fs.writeFileSync(zip, bytes);
              const entries = execFileSync('unzip', ['-Z1', zip], {encoding: 'utf8'}).trim().split(/\r?\n/);
              const allowed = new RegExp(`^mpv-(?:dev-)?${arch}-([0-9]{8})-git-41f6a64506\\.7z$`);
              assert.equal(entries.length, 2);
              assert.equal(new Set(entries).size, 2);
              assert(entries.every(entry => allowed.test(entry)), `Unexpected artifact files: ${name}`);
              assert.equal(entries.filter(entry => entry.startsWith('mpv-dev-')).length, 1);
              assert(entries.every(entry => !fs.existsSync(path.join(directory, entry))), 'Duplicate asset');
              execFileSync('unzip', ['-q', zip, '-d', directory]);
              for (const entry of entries.sort()) {
                dates.add(entry.match(allowed)[1]);
                const archive = path.join(directory, entry);
                execFileSync('7z', ['t', archive], {stdio: 'pipe'});
                if (entry.startsWith('mpv-dev-')) {
                  const dll = execFileSync('7z', ['e', '-so', archive, 'libmpv-2.dll'], {maxBuffer: 256 * 1024 * 1024});
                  assert.equal(dll.toString('ascii', 0, 2), 'MZ');
                  const pe = dll.readUInt32LE(0x3c);
                  assert.equal(dll.toString('ascii', pe, pe + 4), 'PE\0\0');
                  assert.equal(dll.readUInt16LE(pe + 4), machine);
                }
                sums.push(`${crypto.createHash('sha256').update(fs.readFileSync(archive)).digest('hex')}  ${entry}\n`);
                assets.push(entry);
              }
            }
            assert.equal(dates.size, 1, 'Build dates differ between architectures');
            const tag = [...dates][0];
            const sha = run.head_sha;
            await github.rest.git.getCommit({owner, repo, commit_sha: sha});
            fs.writeFileSync(path.join(directory, 'SHA256SUMS'), sums.sort().join(''));
            assets.push('SHA256SUMS');
            const body = `![GitHub release (by tag)](https://img.shields.io/github/downloads/${owner}/${repo}/${tag}/total?label=Downloads)\n\n**Workflow run**: ${run.html_url}`;
            // Validate every artifact before replacing any existing release.
            let previous;
            try {
              previous = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              const {data: reference} = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
              if (reference.object.sha !== sha) {
                await github.rest.git.updateRef({owner, repo, ref: `tags/${tag}`, sha, force: true});
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({owner, repo, ref: `refs/tags/${tag}`, sha});
            }
            if (previous) {
              await github.rest.repos.deleteRelease({owner, repo, release_id: previous.id});
            }
            const {data: release} = await github.rest.repos.createRelease({owner, repo, tag_name: tag, target_commitish: sha, name: tag, body, draft: true});
            for (const name of assets.sort()) {
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name, data: fs.readFileSync(path.join(directory, name))});
            }
            const {data: published} = await github.rest.repos.updateRelease({owner, repo, release_id: release.id, draft: false});
            core.notice(`Published ${published.html_url} from build ${run_id}`);
